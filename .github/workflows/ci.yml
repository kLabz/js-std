name: CI

on:
  push:
  pull_request:

jobs:
  generated:
    name: Generated output is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The generator itself needs Haxe 5
      - uses: HaxeFoundation/setup-haxe@v2
        with:
          haxe-version: latest
      - name: Install generator dependencies
        working-directory: generator
        run: |
          npm install
          haxelib newrepo
          haxelib install hxnodejs --always
          ./fetch-mdn-content.sh
      - name: Regenerate
        working-directory: generator
        run: |
          haxe build.hxml
          node bin/index.js > /dev/null
      - name: Compare with committed output
        run: |
          if [ -n "$(git status --porcelain libs)" ]; then
            git status --short libs | head -50
            echo "::error::libs/ differs from the generator output; regenerate and commit"
            exit 1
          fi

  check:
    name: Typecheck and smoke tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Haxe 4.3.7
            haxe: 4.3.7
            compat: 1
          # std without js.lib.BigInt & co: js-core-api provides them
          - name: Haxe 5 preview
            haxe: 5.0.0-preview.1
            compat: 1
          # std with js.lib.BigInt & co: the change is std-only, so a nightly
          # compiler with the std of HaxeFoundation/haxe#js/stdlib-cleanup
          - name: Haxe 5 js/stdlib-cleanup std
            haxe: latest
            std-branch: js/stdlib-cleanup
            compat: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: HaxeFoundation/setup-haxe@v2
        with:
          haxe-version: ${{ matrix.haxe }}
      - name: Check out std from ${{ matrix.std-branch }}
        if: matrix.std-branch
        uses: actions/checkout@v4
        with:
          repository: HaxeFoundation/haxe
          ref: ${{ matrix.std-branch }}
          path: haxe-src
          sparse-checkout: std
      - name: Use std from ${{ matrix.std-branch }}
        if: matrix.std-branch
        run: echo "HAXE_STD_PATH=$GITHUB_WORKSPACE/haxe-src/std" >> "$GITHUB_ENV"
      - run: haxe --version
      - name: Typecheck all libraries
        run: ./check.sh
      - name: Smoke tests
        env:
          EXPECT_COMPAT: ${{ matrix.compat }}
        run: ./tests/run.sh
