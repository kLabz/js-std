name: CI

on:
  push:
  pull_request:

jobs:
  generated:
    name: Generated output is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The generator itself needs Haxe 5
      - uses: HaxeFoundation/setup-haxe@v2
        with:
          haxe-version: latest
      - name: Install generator dependencies
        working-directory: generator
        run: |
          npm install
          haxelib newrepo
          haxelib install hxnodejs --always
      - name: Regenerate
        working-directory: generator
        run: |
          haxe build.hxml
          node bin/index.js > /dev/null
      - name: Compare with committed output
        run: |
          if [ -n "$(git status --porcelain libs)" ]; then
            git status --short libs | head -50
            echo "::error::libs/ differs from the generator output; regenerate and commit"
            exit 1
          fi

  check:
    name: Typecheck and smoke tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Haxe 4.3.7
            haxe: 4.3.7
            compat: 1
          # std without js.lib.BigInt & co: js-core-api provides them
          - name: Haxe 5 preview
            haxe: 5.0.0-preview.1
            compat: 1
          # std with js.lib.BigInt & co (HaxeFoundation/haxe#js/stdlib-cleanup)
          - name: Haxe 5 js/stdlib-cleanup
            haxe: branch:js/stdlib-cleanup
            compat: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve Haxe version
        id: haxe
        run: |
          version='${{ matrix.haxe }}'
          case "$version" in branch:*)
            # build.haxe.org names branch builds haxe_<date>_<branch, / as _>_<short sha>
            branch=${version#branch:}
            name=$(echo "$branch" | tr / _)
            builds=$(curl -sSL https://build.haxe.org/builds/haxe/linux64/ \
              | grep -oE "haxe_[0-9]{4}-[0-9]{2}-[0-9]{2}_${name}_[0-9a-f]+\.tar\.gz" | sort -u)
            head=$(curl -sSL "https://api.github.com/repos/HaxeFoundation/haxe/commits/$branch" | jq -r '.sha[0:7]')
            build=$(echo "$builds" | grep "_${head}\.tar\.gz$" | tail -1)
            if [ -z "$build" ]; then
              build=$(echo "$builds" | tail -1)
              [ -n "$build" ] && echo "::warning::No build of $branch at $head yet, using $build"
            fi
            if [ -z "$build" ]; then
              echo "::error::No build of $branch on build.haxe.org yet"
              exit 1
            fi
            version=$(echo "$build" | sed -E 's/^haxe_//; s/\.tar\.gz$//')
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: HaxeFoundation/setup-haxe@v2
        with:
          haxe-version: ${{ steps.haxe.outputs.version }}
      - run: haxe --version
      - name: Typecheck all libraries
        run: ./check.sh
      - name: Smoke tests
        env:
          EXPECT_COMPAT: ${{ matrix.compat }}
        run: ./tests/run.sh
