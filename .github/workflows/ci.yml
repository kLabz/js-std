name: CI

on:
  push:
  pull_request:

jobs:
  generated:
    name: Generated output is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The generator itself needs Haxe 5
      - uses: HaxeFoundation/setup-haxe@v2
        with:
          haxe-version: latest
      - name: Install generator dependencies
        working-directory: generator
        run: |
          npm install
          haxelib newrepo
          haxelib install hxnodejs --always
          ./fetch-mdn-content.sh
      - name: Regenerate
        working-directory: generator
        run: |
          haxe build.hxml
          node bin/index.js > /dev/null
      - name: Compare with committed output
        run: |
          if [ -n "$(git status --porcelain libs)" ]; then
            git status --short libs | head -50
            echo "::error::libs/ differs from the generator output; regenerate and commit"
            exit 1
          fi

  check:
    name: Typecheck and smoke tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Haxe 4.3.7
            haxe: 4.3.7
            compat: 1
          # std without js.lib.BigInt & co: js-core-api provides them
          - name: Haxe 5 preview
            haxe: 5.0.0-preview.1
            compat: 1
          # Nightly of HaxeFoundation/haxe#js-std-nightlies: std with js.lib.BigInt & co,
          # explicit call type arguments and method default type parameters
          - name: Haxe 5 js-std-nightlies
            haxe: 2026-11-05_js-std-nightlies_2bca629
            compat: 0
            generic-lookups: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: HaxeFoundation/setup-haxe@v2
        with:
          haxe-version: ${{ matrix.haxe }}
      - run: haxe --version
      - name: Typecheck all libraries
        run: ./check.sh
      - name: Smoke tests
        env:
          EXPECT_COMPAT: ${{ matrix.compat }}
          GENERIC_LOOKUPS: ${{ matrix.generic-lookups }}
        run: ./tests/run.sh
