name: CI

on:
  push:
  pull_request:

jobs:
  generated:
    name: Generated output is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The generator itself needs Haxe 5
      - uses: HaxeFoundation/setup-haxe@v2
        with:
          haxe-version: latest
      - name: Install generator dependencies
        working-directory: generator
        run: |
          npm install
          haxelib newrepo
          haxelib install hxnodejs --always
      - name: Regenerate
        working-directory: generator
        run: |
          haxe build.hxml
          node bin/index.js > /dev/null
      - name: Compare with committed output
        run: |
          if [ -n "$(git status --porcelain libs)" ]; then
            git status --short libs | head -50
            echo "::error::libs/ differs from the generator output; regenerate and commit"
            exit 1
          fi

  check:
    name: Typecheck and smoke tests (Haxe ${{ matrix.haxe }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        haxe: [4.3.7, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: HaxeFoundation/setup-haxe@v2
        with:
          haxe-version: ${{ matrix.haxe }}
      - run: haxe --version
      - name: Typecheck all libraries
        run: ./check.sh
      - name: Smoke tests
        run: ./tests/run.sh
